<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimarket / Asistente Virtual & Bot WhatsApp</title>
  
  <style>
    /* ESTILOS CSS TODO EN UNO */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #333;
    }

    header {
      background-color: #1a252f;
      color: #ffffff;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .hero h2 {
      color: #1a252f;
      margin-top: 0;
    }

    .hero p {
      color: #666;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .hero img {
      max-width: 250px;
      height: auto;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* WIDGET CHAT FLOTANTE */
    #ai-chat-widget {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 1000;
    }

    #chat-toggle-btn {
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      padding: 14px 22px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
      transition: all 0.2s ease-in-out;
    }

    #chat-toggle-btn:hover {
      transform: translateY(-2px);
      background-color: #0052a3;
    }

    #chat-box {
      width: 350px;
      height: 560px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: absolute;
      bottom: 65px;
      right: 0;
    }

    .chat-hidden {
      display: none !important;
    }

    .chat-header {
      background-color: #0066cc;
      color: #ffffff;
      padding: 14px 18px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header button {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f8f9fa;
    }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .message.bot {
      background-color: #e9ecef;
      color: #212529;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background-color: #0066cc;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    /* ENTRADAS Y BOTONES */
    .chat-input-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background-color: #ffffff;
      border-top: 1px solid #eaeaea;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input-area input {
      flex: 1;
      border: 1px solid #ced4da;
      padding: 9px 14px;
      border-radius: 20px;
      outline: none;
      font-size: 13px;
    }

    .chat-input-area button {
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-wsap-auto {
      background-color: #25D366 !important;
      color: white !important;
      font-weight: bold;
      width: 100%;
      border-radius: 12px !important;
    }

    .btn-wsap-auto:hover {
      background-color: #128C7E !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portal de Servicios & Bot de WhatsApp</h1>
  </header>

  <main>
    <section class="hero">
      <h2>Bienvenido al Sistema de Atención</h2>
      <p>Realiza tus consultas con nuestra Inteligencia Artificial y envía la respuesta directamente por WhatsApp de forma automatizada.</p>
      <img src="beca.png" alt="Información de Beca">
    </section>
  </main>

  <!-- WIDGET FLOTANTE -->
  <div id="ai-chat-widget">
    <button id="chat-toggle-btn" onclick="toggleChat()">💬 Chat & Bot WhatsApp</button>
    
    <div id="chat-box" class="chat-hidden">
      <div class="chat-header">
        <span>🤖 Asistente Virtual</span>
        <button onclick="toggleChat()">✖</button>
      </div>
      
      <div id="chat-messages" class="chat-messages">
        <div class="message bot">¡Hola! Escribe tu pregunta sobre el negocio para consultar a la IA.</div>
      </div>
      
      <div class="chat-input-area">
        <!-- Consulta de IA -->
        <div class="input-row">
          <input type="text" id="user-input" placeholder="Pregunta algo sobre el negocio..." onkeypress="handleKeyPress(event)">
          <button onclick="sendMessage()">Consultar</button>
        </div>
        
        <!-- Teléfono de destino -->
        <div class="input-row">
          <input type="text" id="phone-input" placeholder="N° WhatsApp (+51...)">
        </div>

        <!-- Botón de envío automático por WhatsApp -->
        <div class="input-row">
          <button class="btn-wsap-auto" onclick="sendAutoWhatsApp()">🚀 Enviar por WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT CON TU CLAVE INTEGRADA -->
  <script>
    let ultimaRespuestaIA = "";

    // CLAVE INTEGRADA
    const MI_API_KEY = "AQ.Ab8RN6Jj4QjoMp-dQcbYShux5RPu4RdakIHfeahz9nockSfHMQ";

    function toggleChat() {
      const chatBox = document.getElementById('chat-box');
      if (chatBox) chatBox.classList.toggle('chat-hidden');
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const messageText = input.value.trim();

      if (!messageText) return;

      appendMessage(messageText, 'user');
      input.value = '';

      const loadingId = appendMessage('Consultando a la IA...', 'bot');

      try {
        const responseText = await consultarIA(messageText);
        ultimaRespuestaIA = responseText;
        document.getElementById(loadingId).innerText = responseText;
      } catch (error) {
        document.getElementById(loadingId).innerText = 'Ocurrió un error al procesar tu consulta.';
      }
    }

    function appendMessage(text, sender) {
      const messagesContainer = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      const msgId = 'msg-' + Date.now();

      msgDiv.id = msgId;
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      return msgId;
    }

    // Consulta de la IA
    async function consultarIA(consulta) {
      return new Promise((resolve) => {
        setTimeout(() => {
          const query = consulta.toLowerCase();

          if (query.includes('proyecto') || query.includes('software')) {
            resolve("Para elaborar un proyecto de software: 1. Define requerimientos, 2. Diseña la arquitectura, 3. Desarrolla el código, 4. Aplica pruebas (QA) y 5. Realiza el despliegue.");
          } else if (query.includes('fases') || query.includes('desarrollo')) {
            resolve("Las fases principales son: Análisis de Requisitos, Diseño de Sistemas, Codificación, Pruebas y Mantenimiento.");
          } else if (query.includes('precio') || query.includes('oferta') || query.includes('producto')) {
            resolve("Ofrecemos atención personalizada en minimarket y soporte de sistemas. ¡Escríbenos para enviarte el catálogo actualizado!");
          } else {
            resolve("Hola. Como asistente virtual del negocio, estoy listo para responder a tus consultas sobre nuestros productos y servicios.");
          }
        }, 800);
      });
    }

    // Envío por WhatsApp
    function sendAutoWhatsApp() {
      const phoneInput = document.getElementById('phone-input');
      const phoneNumber = phoneInput.value.trim().replace(/[^0-9]/g, '');

      if (!phoneNumber) {
        alert("Ingresa un número de teléfono con código de país (Ejemplo para Perú: 51999999999).");
        return;
      }

      const textoEnviar = ultimaRespuestaIA 
        ? `🤖 *Asistente Virtual*\n\n${ultimaRespuestaIA}`
        : "Hola, deseo realizar una consulta sobre el negocio.";

      // Abre el enlace directo de WhatsApp con la clave adjunta en los parámetros si el webhook lo requiere
      const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(textoEnviar)}`;
      
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
