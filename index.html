<!DOCTYPE html>
<html lang="qu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Willakuy Apachiq</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #1a252f;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #128C7E;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>💬 WhatsApp Apachiq</h2>
    
    <div class="input-group">
      <label for="phone">Yupay (Código de país nisqawan, ej: 51999999999):</label>
      <input type="text" id="phone" placeholder="51999999999">
    </div>

    <div class="input-group">
      <label for="message">Willakuy / Texto:</label>
      <textarea id="message" rows="4" placeholder="Qillqay kaypi willakuyta..."></textarea>
    </div>

    <button onclick="sendWhatsApp()">WhatsApp-man Apachiy 📱</button>
  </div>

  <script>
    function sendWhatsApp() {
      const phone = document.getElementById('phone').value.trim().replace(/[^0-9]/g, '');
      const message = document.getElementById('message').value.trim();

      if (!phone) {
        alert("Allichay yupayta (Número de teléfono).");
        return;
      }

      if (!message) {
        alert("Qillqay imatapas willakuypi.");
        return;
      }

      // URL oficial de WhatsApp para abrir el chat con texto
      const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;
      
      // Abrir en WhatsApp App o WhatsApp Web
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
